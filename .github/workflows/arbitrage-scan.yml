name: Arbitrage Scanner

on:
  push:
    branches: [master]
    paths:
      - "arbitrage/**"
      - ".github/workflows/arbitrage-scan.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arbitrage-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -q requests brotli

      - name: Run scanner (лог в файл, ошибка не роняет прогон)
        run: python ci_scan.py 2>&1 | tee arbitrage_run.log
        working-directory: arbitrage
        continue-on-error: true
        env:
          SCAN_BUDGET_SEC: "700"

      - name: Commit data and log
        if: always()
        run: |
          git config user.name "arb-bot"
          git config user.email "bot@users.noreply.github.com"
          cp arbitrage/arbitrage_run.log arbitrage/last_run.txt 2>/dev/null || echo "(лог не создан)" > arbitrage/last_run.txt
          date -u +%FT%TZ >> arbitrage/last_run.txt
          git add arbitrage/ || true
          git diff --cached --quiet || (git commit -m "arb scan [skip ci]" && git fetch origin && git rebase origin/master && git push origin HEAD:master)
