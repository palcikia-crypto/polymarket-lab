name: pm-lab
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/pm-lab.yml", "autolab/lab.py"]
concurrency:
  group: pm-lab
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Research lab (settle + hypotheses)
        run: timeout 240 python autolab/lab.py
        continue-on-error: true
      - name: Commit lab data
        run: |
          git config user.name "pm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/ || true
          git diff --cached --quiet || (git commit -m "auto: pm lab [skip ci]" && for i in 1 2 3; do git fetch origin && git rebase origin/master && git push origin HEAD:master && break; done)
