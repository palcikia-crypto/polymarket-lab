name: pm-worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["autolab/**", ".github/workflows/pm-worker.yml", "results/**"]
concurrency:
  group: pm-worker
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recover state from history
        run: python autolab/recover_state.py || true
      - name: Diag API
        run: timeout 60 python autolab/diag.py 2> results/diag_err.txt || true
      - name: Scan + paper trade
        run: |
          rm -f results/worker_flag.txt
          timeout 300 python autolab/worker.py > results/worker_log.txt 2> results/worker_err.txt || echo "worker exit nonzero" > results/worker_flag.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "pm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/ || true
          git diff --cached --quiet || (git commit -m "auto: pm scan [skip ci]" && for i in 1 2 3; do git fetch origin && git rebase origin/main && git push origin HEAD:main && break; done)
