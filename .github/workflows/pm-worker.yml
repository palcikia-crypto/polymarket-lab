name: pm-worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["autolab/**", ".github/workflows/pm-worker.yml", "results/**"]
concurrency:
  group: pm-worker
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan + paper trade
        run: timeout 240 python autolab/worker.py
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name "pm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/ || true
          git diff --cached --quiet || (git commit -m "auto: pm scan [skip ci]" && for i in 1 2 3; do git fetch origin && git rebase origin/master && git push origin HEAD:master && break; done)
