version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymarket-lab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:///./data/polymarket.db
      - REDIS_URL=redis://redis:6379/0
      - POLYMARKET_GAMMA_API_URL=https://gamma-api.polymarket.com
      - POLYMARKET_CLOB_API_URL=https://clob.polymarket.com
      - CRYPTO_TAG_ID=21
      - PAPER_TRADING_ENABLED=true
      - PAPER_TRADING_INITIAL_BALANCE=10000
      - ENABLE_REAL_TRADING=false
      - AUTO_TRADE=false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - polymarket-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: polymarket-lab-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - polymarket-network

  # Frontend (React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: polymarket-lab-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    networks:
      - polymarket-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: polymarket-lab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - polymarket-network

volumes:
  redis-data:

networks:
  polymarket-network:
    driver: bridge
